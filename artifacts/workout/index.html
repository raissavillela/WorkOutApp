   GIFs demonstrativos vindos da API workoutxapp via proxy /api/exercise-media.
   Nunca exibido para exercícios de Cardio. */
const _media={}; /* normalizedName -> {state:'loading'|'ok'|'miss'|'err', data} */
function _normName(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
function _safeId(k){return k.replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'_');}
function fetchMedia(ptName){
  const k=_normName(ptName);
  if(_media[k])return;
  _media[k]={state:'loading'};
  fetch('/api/exercise-media?name='+encodeURIComponent(ptName))
    .then(r=>r.json().then(j=>({ok:r.ok,status:r.status,j})))
    .then(({ok,status,j})=>{
      if(!ok){
        _media[k]={state:status===503?'noapi':'err',msg:j&&j.message||j&&j.error||''};
      }else if(j.gifUrl){
        _media[k]={state:'ok',data:j};
      }else{
        _media[k]={state:'miss'};
      }
      render();
    })
    .catch(e=>{_media[k]={state:'err',msg:String(e)};render();});
}
function getMedia(ptName){return _media[_normName(ptName)];}
function toggleExpand(stId,ei,ptName){
  const k=stId+'-'+ei;
  if(S.expanded[k]){delete S.expanded[k];render();return;}

}

function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
const EPM={cardio:1,metabolico:2,core:2,crossfit:2,funcional:2,musculacao:2};
function buildGP(mod){const r={};(GEN[mod]||[]).forEach(ex=>{const g=ex.g||'g';r[g]=r[g]||[];r[g].push(ex);});return r;}
function generateWorkout(mods,num,setsCount){
  const sc=setsCount||3;
  const gp={},ug={};
  mods.forEach(mod=>{if(GEN[mod]&&GEN[mod][0]&&GEN[mod][0].g){gp[mod]=buildGP(mod);ug[mod]=[];}});
  const pools={},used={};mods.forEach(mod=>{pools[mod]=shuffle(GEN[mod]||[]);used[mod]=0;});
  function pickSeq(mod,n){const r=[];for(let i=0;i<n;i++){if(used[mod]>=pools[mod].length){pools[mod]=shuffle(GEN[mod]||[]);used[mod]=0;}if(pools[mod].length>0)r.push({...pools[mod][used[mod]++],modality:mod});}return r;}
  function pickGrp(mod,n){const allG=Object.keys(gp[mod]);const av=allG.filter(g=>ug[mod].indexOf(g)===-1);const pool=av.length>0?av:allG;const cg=pool[Math.floor(Math.random()*pool.length)];ug[mod].push(cg);if(ug[mod].length>=allG.length)ug[mod]=[];return shuffle(gp[mod][cg]).slice(0,Math.min(n,gp[mod][cg].length)).map(ex=>({...ex,modality:mod}));}
  return Array.from({length:num},(_,i)=>{const exercises=[];mods.forEach(mod=>{const n=EPM[mod]||2;exercises.push(...(gp[mod]?pickGrp(mod,n):pickSeq(mod,n)));});return{id:i+1,sets:sc,exercises};});
}

function _allExerciseRows(){
  const rows={};
  WDB.forEach(w=>w.s.forEach(st=>(st.e||[]).forEach(ex=>{
    if(!ex||!ex.n||ex.m==='cardio')return;
    const k=_normName(ex.n);
    if(!rows[k])rows[k]={name:ex.n,modalities:new Set()};
    rows[k].modalities.add(ex.m);
  })));
  Object.keys(GEN).forEach(mod=>{
    if(mod==='cardio')return;
    (GEN[mod]||[]).forEach(ex=>{
      if(!ex||!ex.n)return;
      const k=_normName(ex.n);
      if(!rows[k])rows[k]={name:ex.n,modalities:new Set()};
      rows[k].modalities.add(mod);
    });
  });
  return Object.keys(rows).sort().map(k=>({key:k,name:rows[k].name,modalities:[...rows[k].modalities]}));
}

function loadCI(){try{return JSON.parse(localStorage.getItem('wk_ci')||'{}');}catch(e){return {};}}
function saveCI(d,ti,c,dur){const ci=loadCI();ci[d]={title:ti,calories:Number(c)||0,duration:Number(dur)||0};localStorage.setItem('wk_ci',JSON.stringify(ci));}
function fmtDur(mins){if(!mins||mins<=0)return '0h';if(mins<60)return mins+'m';const h=Math.floor(mins/60),m=mins%60;return m?h+'h '+m+'m':h+'h';}
function fmtCals(cals){if(!cals||cals<=0)return '0';if(cals>=1000)return (Math.round(cals/100)/10)+'k';return String(cals);}
function delCI(d){const ci=loadCI();delete ci[d];localStorage.setItem('wk_ci',JSON.stringify(ci));}
function loadProfile(){try{return JSON.parse(localStorage.getItem('wk_profile')||'null');}catch(e){return null;}}
function saveProfile(p){localStorage.setItem('wk_profile',JSON.stringify(p));}
function deleteProfile(){if(confirm(LANG==='pt'?'Sair do perfil?':'Log out?')){localStorage.removeItem('wk_profile');S.profileEditing=false;navTo(home);}}
function triggerPhotoUpload(){document.getElementById('wk-photo-input').click();}
function handlePhotoUpload(input){
  const file=input.files&&input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{S.profilePhotoPreview=e.target.result;render();};
  reader.readAsDataURL(file);
}
function saveProfileSetup(){
  const inp=document.getElementById('profile-name-input');
  const name=(inp?inp.value:'').trim();
  if(!name){if(inp)inp.style.border='1px solid #E8550A';return;}
  const existing=loadProfile()||{};
  saveProfile(Object.assign({},existing,{name:name,photo:S.profilePhotoPreview||existing.photo||null}));
  S.profilePhotoPreview=null;S.profileEditing=false;render();
}
function doCheckIn(){
  const now=new Date();
  const dk=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  const ex=loadCI()[dk]||{};
  S.checkInModal={date:dk,dur:ex.duration||0,cals:ex.calories||0};render();
}
function openCiEdit(dk){
  const ex=loadCI()[dk]||{};
  S.checkInModal={date:dk,dur:ex.duration||0,cals:ex.calories||0};render();
}
function saveCheckIn(){
  const dur=Number((document.getElementById('ci-dur-input')||{}).value)||0;
  const cals=Number((document.getElementById('ci-cals-input')||{}).value)||0;
  saveCI(S.checkInModal.date,'Check-in',cals,dur);
  S.checkInModal=null;render();
}
function deleteCheckIn(){
  delCI(S.checkInModal.date);
  S.checkInModal=null;render();
}
function miniCalHtml(ci,photo){
  const now=new Date();const y=now.getFullYear(),m=now.getMonth();
  const mKey=y+'-'+String(m+1).padStart(2,'0');
  const months_pt=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const months_en=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const monthName=(LANG==='pt'?months_pt:months_en)[m]+' '+y;
  const DLABELS=LANG==='pt'?['D','S','T','Q','Q','S','S']:['S','M','T','W','T','F','S'];
  const firstDay=new Date(y,m,1).getDay();const daysInMonth=new Date(y,m+1,0).getDate();
  let cells='';
  cells+=DLABELS.map(function(d){return '<div style="text-align:center;font-size:9px;font-weight:700;color:#6E6050;padding:5px 0">'+d+'</div>';}).join('');
  for(let i=0;i<firstDay;i++)cells+='<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const dk=mKey+'-'+String(d).padStart(2,'0');
    const hasCi=!!ci[dk];const isToday=(d===now.getDate());
    if(hasCi){cells+='<div onclick="openCiEdit(\''+dk+'\')" style="cursor:pointer;text-align:center;padding:3px 0"><div style="font-size:12px;font-weight:'+(isToday?'900':'600')+';color:'+(isToday?'#E8550A':'#ddd')+';line-height:1;margin-bottom:4px">'+d+'</div><div style="width:7px;height:7px;border-radius:50%;background:#E8550A;margin:0 auto"></div></div>';}
    else{cells+='<div style="text-align:center;font-size:12px;color:'+(isToday?'#E8550A':'#4A3C2E')+';font-weight:'+(isToday?'900':'400')+';padding:7px 0">'+d+'</div>';}
  }
  return '<div style="margin-bottom:20px">'
    +'<div style="font-size:14px;font-weight:900;text-align:center;color:#fff;margin-bottom:12px;letter-spacing:.5px">'+monthName+'</div>'
    +'<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">'+cells+'</div>'
    +'</div>';
}

function prevMonth(){if(S.calMonth===0){S.calMonth=11;S.calYear--;}else{S.calMonth--;}render();}
function nextMonth(){if(S.calMonth===11){S.calMonth=0;S.calYear++;}else{S.calMonth++;}render();}
function openCalDay(d){S.calModal=d;render();}
function closeCalModal(){S.calModal=null;render();}
function saveCalEntry(){const ti=(document.getElementById('ci-title')||{}).value||'';const c=(document.getElementById('ci-cals')||{}).value||'';if(S.calModal){saveCI(S.calModal,ti,c);}S.calModal=null;render();}
function delCalEntry(d){delCI(d);S.calModal=null;render();}

function calScreen(){
  const ci=loadCI();
  const now=new Date();
  const todayStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  const y=S.calYear,m=S.calMonth;
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const mKey=y+'-'+String(m+1).padStart(2,'0');
  const ciKeys=Object.keys(ci).filter(k=>k.startsWith(mKey));
  const totalCals=ciKeys.reduce((a,k)=>a+(parseInt(ci[k].calories)||0),0);
  const MONTHS=LANG==='en'?MONTHS_EN:MONTHS_PT;
  const WDAYS=LANG==='en'?WDAYS_EN:WDAYS_PT;
  const wdayHtml=WDAYS.map(d=>'<div style="text-align:center;font-size:9px;font-weight:700;color:#6E6050;padding:4px 0">'+d+'</div>').join('');
  let cells='';
  for(let i=0;i<firstDay;i++)cells+='<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const hasCi=!!ci[ds];const isToday=ds===todayStr;
    cells+='<div onclick="openCalDay(\''+ds+'\')" style="aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;border:2px solid '+(isToday?'#fff':'transparent')+';background:'+(hasCi?'#071507':'transparent')+';position:relative">'
      +'<span style="font-size:13px;font-weight:'+(isToday||hasCi?'800':'400')+';color:'+(isToday?'#fff':hasCi?'#2ED573':'#666')+'">'+d+'</span>'
      +(hasCi?'<span style="width:4px;height:4px;border-radius:50%;background:#2ED573;position:absolute;bottom:4px"></span>':'')
      +'</div>';
  }
  const header='<div class="sticky" style="padding:13px 16px 11px;border-bottom:1px solid #231E15">'
    +'<div style="display:flex;align-items:center;gap:9px;margin-bottom:13px">'
    +'<button onclick="navTo(home)" style="background:none;color:#9C8F80;font-size:22px;padding:0 4px">←</button>'

    +'<div style="margin-left:auto">'+langToggleBtn()+'</div>'
    +'</div>'
    +'<div style="display:flex;align-items:center;justify-content:space-between">'
    +'<button onclick="prevMonth()" style="background:none;color:#9C8F80;font-size:24px;padding:2px 10px">‹</button>'
    +'<div style="font-size:14px;font-weight:800">'+MONTHS[m]+' '+y+'</div>'
    +'<button onclick="nextMonth()" style="background:none;color:#9C8F80;font-size:24px;padding:2px 10px">›</button>'
    +'</div>'+'</div>';
  const statsHtml=ciKeys.length>0
    ?'<div style="display:flex;gap:8px;margin:12px 14px 0">'
    +'<div style="flex:1;background:#1F1C18;border-radius:12px;padding:11px;border:1px solid #272118;text-align:center">'
    +'<div style="font-size:22px;font-weight:900;color:#2ED573">'+ciKeys.length+'</div>'
    +'<div style="font-size:9px;color:#9C8F80;margin-top:2px">'+t('workoutsLabel')+'</div></div>'
    +(totalCals>0?'<div style="flex:1;background:#1F1C18;border-radius:12px;padding:11px;border:1px solid #272118;text-align:center">'
    +'<div style="font-size:22px;font-weight:900;color:#FFA502">'+totalCals.toLocaleString()+'</div>'
    +'<div style="font-size:9px;color:#9C8F80;margin-top:2px">'+t('kcalLabel')+'</div></div>':'')
    +'</div>':'';
  const grid='<div style="padding:10px 12px">'
    +'<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px">'+wdayHtml+'</div>'
    +'<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">'+cells+'</div>'
    +'</div>'
    +'<p style="text-align:center;font-size:10px;color:#6E6050;margin-top:8px">'+t('tapDay')+'</p>';
  let modalHtml='';
  if(S.calModal){
    const ds=S.calModal;
    const parts=ds.split('-');
    const MONTHS2=LANG==='en'?MONTHS_EN:MONTHS_PT;
    const dateLabel=LANG==='en'
      ?(MONTHS2[parseInt(parts[1])-1]+' '+parseInt(parts[2])+', '+parts[0])
      :(parseInt(parts[2])+' de '+MONTHS2[parseInt(parts[1])-1]+' '+parts[0]);
    const ex=ci[ds]||null;
    modalHtml='<div onclick="closeCalModal()" style="position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:flex-end">'
      +'<div onclick="event.stopPropagation()" style="background:#211C13;border-radius:20px 20px 0 0;padding:24px 18px 36px;width:100%;max-width:480px;margin:0 auto;border-top:1px solid #302820">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">'
      +'<div><div style="font-size:10px;font-weight:700;letter-spacing:2px;color:#9C8F80;margin-bottom:3px">'+t('checkin')+'</div>'
      +'<div style="font-size:17px;font-weight:900">'+dateLabel+'</div></div>'
      +(ex?'<button onclick="delCalEntry(\''+ds+'\')" style="background:none;color:#9C8F80;font-size:11px;padding:6px 10px;border:1px solid #302820;border-radius:8px;cursor:pointer">'+t('deleteBtn')+'</button>':'<button onclick="closeCalModal()" style="background:none;color:#9C8F80;font-size:20px;padding:0 6px">×</button>')
      +'</div>'
      +'<div style="margin-bottom:12px">'
      +'<label style="font-size:9px;font-weight:700;letter-spacing:2px;color:#9C8F80;display:block;margin-bottom:6px">'+t('titleLabel')+'</label>'
      +'<input id="ci-title" type="text" placeholder="'+t('titlePlaceholder')+'" value="'+(ex?ex.title:'')+'" style="width:100%;background:#272118;border:1px solid #3A3028;border-radius:10px;padding:12px 14px;color:#fff;font-size:13px;font-family:inherit;outline:none">'
      +'</div>'
      +'<div style="margin-bottom:22px">'
      +'<label style="font-size:9px;font-weight:700;letter-spacing:2px;color:#9C8F80;display:block;margin-bottom:6px">'+t('calsLabel')+'</label>'
      +'<input id="ci-cals" type="number" placeholder="'+t('calsPlaceholder')+'" value="'+(ex&&ex.calories?ex.calories:'')+'" style="width:100%;background:#272118;border:1px solid #3A3028;border-radius:10px;padding:12px 14px;color:#fff;font-size:13px;font-family:inherit;outline:none">'
      +'</div>'
      +'<button onclick="saveCalEntry()" style="width:100%;padding:14px;border-radius:12px;background:#2ED573;color:#000;font-size:13px;font-weight:900;letter-spacing:1px;cursor:pointer">'+t('saveBtn')+'</button>'
      +'</div>'
      +'</div>';
  }
  return '<div style="min-height:100vh;padding-bottom:40px">'+header+statsHtml+grid+modalHtml+'</div>';
}

        const md=getMedia(ptName);
        if(!md||md.state==='loading'){
          mediaHtml='<div style="padding:18px;text-align:center;color:#9C8F80;font-size:11px">'+t('loadingMedia')+'</div>';
        }else if(md.state==='ok'){
          const altTxt=(md.data.name||dispName).replace(/"/g,'&quot;');
          mediaHtml='<div style="padding:10px 14px 12px"><div style="background:#171410;border-radius:10px;overflow:hidden;border:1px solid #272118"><img src="'+md.data.gifUrl+'" alt="'+altTxt+'" loading="lazy" style="width:100%;height:auto;display:block"></div><div style="margin-top:6px;font-size:10px;color:#9C8F80;font-style:italic">'+altTxt+(md.data.exerciseId?' · #'+md.data.exerciseId:'')+'</div></div>';
        }else if(md.state==='noapi'){
          mediaHtml='<div style="padding:14px"><div style="padding:14px;text-align:center;color:#9C8F80;font-size:11px;background:#171410;border-radius:10px;border:1px dashed #302820">'+t('apiMissing')+'</div></div>';
        }else{
          mediaHtml='<div style="padding:14px"><div style="padding:14px;text-align:center;color:#9C8F80;font-size:11px;background:#171410;border-radius:10px;border:1px dashed #302820">'+t('noMedia')+'</div></div>';
        }
      }
      const toggleBtn=isCardio?'':'<button onclick="toggleExpand('+st.id+','+ei+",'"+ptName.replace(/'/g,"\\'")+"'"+')" style="margin-top:8px;background:'+(isExp?'#191510':'transparent')+';color:'+(m?m.c:'#888')+';border:1px solid '+(isExp?(m?m.c:'#333'):'#272118')+';border-radius:8px;padding:5px 10px;font-size:10px;font-weight:700;letter-spacing:0.5px;cursor:pointer">'+(isExp?t('hideExec'):t('showExec'))+'</button>';
      return '<div style="border-bottom:'+(ei<exs.length-1?'1px solid #211C13':'none')+'">'
        +'<div style="padding:10px 14px">'
        +(m?'<div style="font-size:9px;font-weight:700;color:'+m.c+';margin-bottom:3px">'+m.e+' '+mLabel(m).toUpperCase()+'</div>':'')
        +'<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">'
        +'<div style="flex:1"><div style="font-size:12px;font-weight:600;line-height:1.4;color:#ddd">'+dispName+'</div>'
        +(ex.note?'<div style="font-size:9px;color:#9C8F80;margin-top:1px">'+ex.note+'</div>':'')+'</div>'
        +'<div style="text-align:right;flex-shrink:0">'
        +'<div style="font-size:13px;font-weight:900;color:'+(m?m.c:'#aaa')+'">'+(ex.r||ex.metric||'')+'</div>'
        +'<div onclick="editWeight('+st.id+','+ei+')" style="font-size:9px;color:#9C8F80;margin-top:2px;cursor:pointer">🏋 <span style="border-bottom:1px dashed #444">'+(cw||'— kg')+'</span></div>'
        +'</div></div>'
        +toggleBtn
        +'</div>'
        +mediaHtml
        +'</div>';
    }).join('');
    return '<div style="border-radius:16px;border:1px solid '+(done?'#1c4a2c':'#272118')+';background:'+(done?'#081508':'#1F1C18')+';overflow:hidden;margin-bottom:10px"><div style="display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid #231E15"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:22px;font-weight:900;color:'+(done?'#2ED573':'#3A3028')+'">'+String(idx+1).padStart(2,'0')+'</span><span style="font-size:9px;font-weight:800;padding:2px 8px;border-radius:99px;background:'+(done?'#2ED573':'#272118')+';color:'+(done?'#000':'#555')+'">'+(done?'OK':st.sets+' '+t('sets'))+'</span></div>'+(done?'':'<div style="display:flex;gap:5px">'+setBtns+'</div>')+'</div>'+exHtml+'</div>';
  }).join('');
  const compHtml=allDone?'<div style="border-radius:16px;border:1px solid rgba(46,213,115,.4);background:#051005;padding:26px 18px;text-align:center;margin-top:4px"><div style="font-size:40px;margin-bottom:8px">🎉</div><div style="font-size:18px;font-weight:900;color:#2ED573">'+t('workoutDone')+'</div><div style="color:#2a6a3a;font-size:12px;margin-top:5px">'+t('workoutDoneMsg')+'</div><button onclick="navTo(home)" style="margin-top:18px;background:#2ED573;color:#000;border-radius:10px;padding:11px 24px;font-size:12px;font-weight:900;cursor:pointer">'+t('newWorkout')+'</button></div>':'';
  const modBadges=S.wMods.map(badge).join(' ');
  return '<div style="min-height:100vh;padding-bottom:80px"><div class="sticky" style="padding:13px 16px 11px;border-bottom:1px solid #231E15"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px"><button onclick="navTo(home)" style="background:none;color:#9C8F80;font-size:22px;padding:0 4px">←</button><div style="text-align:center"><div style="font-size:13px;font-weight:900;letter-spacing:1px">'+S.wTitle+'</div><div style="font-size:9px;color:#9C8F80">'+S.wSub+'</div></div>'+(S.isPre?'<div style="width:26px"></div>':'<button onclick="doRegen()" style="background:none;color:#9C8F80;font-size:18px;padding:0 4px">↺</button>')+'</div><div style="background:#272118;border-radius:99px;height:3px;overflow:hidden"><div style="height:100%;background:'+(allDone?'#2ED573':'#fff')+';width:'+pct+'%;transition:width 0.4s;border-radius:99px"></div></div><div style="display:flex;justify-content:space-between;margin-top:5px"><div style="display:flex;flex-wrap:wrap;gap:4px">'+modBadges+'</div><span style="font-size:10px;color:#6E6050">'+comp+'/'+tot+'</span></div></div><div style="padding:11px 14px">'+stHtml+compHtml+'</div></div>';
}

function render(){
  const root=document.getElementById('root');
  const sc=window.scrollY;
  if(S.screen==='home')root.innerHTML=homeScreen();
  else if(S.screen==='lib')root.innerHTML=libScreen();
  else if(S.screen==='setup')root.innerHTML=setupScreen();
  else if(S.screen==='workout')root.innerHTML=workoutScreen();
  else if(S.screen==='cal')root.innerHTML=calScreen();
  else if(S.screen==='legit')root.innerHTML=legitScreen();
  else if(S.screen==='profile')root.innerHTML=profileScreen();
  if(S.screen==='workout')setTimeout(()=>window.scrollTo(0,sc),0);
}
render();
</script>
</body>
</html>
